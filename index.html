<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZWA | المستشار الذكي والرادار التفاعلي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #08090b;
      --card-bg: rgba(20, 24, 34, 0.85);
      --border-color: rgba(197, 160, 89, 0.25);
      --accent-gold: #c5a059;
      --accent-gold-glow: rgba(197, 160, 89, 0.45);
      --text-main: #f5f5f7;
      --text-muted: #9aa0a6;
      --success-green: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* شريط علوي أنيق */
    header {
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(8, 9, 11, 0.9);
      backdrop-filter: blur(10px);
      z-index: 50;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--accent-gold);
    }

    .radar-indicator {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background 0.3s;
    }

    .pulse-dot.active {
      background: var(--success-green);
      box-shadow: 0 0 10px var(--success-green);
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* الشاشات والمراحل */
    .stage-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .view-stage {
      display: none;
      flex: 1;
      width: 100%;
      animation: fadeIn 0.6s ease forwards;
    }

    .view-stage.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* المرحلة الأولى: بوابة الرادار والاستقبال */
    #stage-concierge {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .orb-wrapper {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 1.5rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .radar-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      animation: radarSweep 3s infinite linear;
    }

    .radar-ring:nth-child(2) {
      width: 140%;
      height: 140%;
      animation-delay: 1.5s;
    }

    @keyframes radarSweep {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .ai-orb {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #eedcb2, var(--accent-gold) 60%, #4a3818 100%);
      box-shadow: 0 0 35px var(--accent-gold-glow);
      transition: all 0.4s ease;
      z-index: 2;
    }

    .ai-orb.speaking {
      animation: orbPulse 1s infinite alternate;
      box-shadow: 0 0 50px rgba(197, 160, 89, 0.8);
    }

    @keyframes orbPulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .welcome-text {
      max-width: 650px;
      margin: 1.5rem auto;
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.7;
      color: var(--text-main);
      min-height: 4.5rem;
    }

    .single-action-box {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .custom-action-btn {
      background: linear-gradient(135deg, #dfc17b, var(--accent-gold));
      color: #08090b;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 1.1rem 2.8rem;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(197, 160, 89, 0.4);
      transition: all 0.3s;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .custom-action-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 30px rgba(197, 160, 89, 0.6);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    .options-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .opt-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.75rem 1.4rem;
      border-radius: 30px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .opt-chip:hover {
      border-color: var(--accent-gold);
      background: rgba(197, 160, 89, 0.15);
    }

    /* المرحلة الثانية: صالة العرض والسلة */
    #stage-showroom {
      flex-direction: column;
      padding: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .showroom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    .back-btn {
      background: transparent;
      color: var(--accent-gold);
      border: 1px solid var(--border-color);
      padding: 0.6rem 1.4rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card.highlight {
      border-color: var(--accent-gold);
      box-shadow: 0 0 20px var(--accent-gold-glow);
    }

    .product-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #14171f;
    }

    .product-info {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .product-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .product-bottom {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-price {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--accent-gold);
    }

    .add-btn {
      background: rgba(197, 160, 89, 0.2);
      border: 1px solid var(--accent-gold);
      color: #fff;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-btn:hover {
      background: var(--accent-gold);
      color: #08090b;
    }

    /* لوحة السلة ورمز الواتساب */
    .cart-checkout-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      align-items: center;
      justify-content: space-between;
    }

    .cart-summary {
      flex: 1;
      min-width: 250px;
    }

    .cart-items-list {
      list-style: none;
      margin: 1rem 0;
      max-height: 150px;
      overflow-y: auto;
    }

    .cart-items-list li {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    #qr-canvas {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      width: 150px;
      height: 150px;
    }

    /* فيديو الكاميرا المخفي للمعالجة */
    #radar-video, #radar-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <!-- رأس الصفحة -->
  <header>
    <div class="brand-title">EZWA</div>
    <div class="radar-indicator">
      <div id="radar-status-dot" class="pulse-dot"></div>
      <span id="radar-status-text">جاري بدء الرادار...</span>
    </div>
  </header>

  <div class="stage-container">
    <!-- المرحلة 1: بوابة الاستقبال والرادار -->
    <section id="stage-concierge" class="view-stage active">
      <div class="orb-wrapper" id="orb-trigger" onclick="unlockAudioAndTrigger()">
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="ai-orb" id="voice-orb"></div>
      </div>

      <div class="welcome-text" id="welcome-message">
        اقترب من الشاشة أو انقر على الكرة للبدء
      </div>

      <div class="single-action-box" id="action-wrapper" style="display: none;">
        <!-- الزر المخصص يتولد هنا ديناميكياً -->
      </div>

      <div class="options-row" id="quick-options">
        <button class="opt-chip" onclick="handleCustomerChoice('new_collection')">أحدث التشكيلات والبوكس فيت</button>
        <button class="opt-chip" onclick="handleCustomerChoice('sizes')">عندي طلب معين والمقاسات</button>
        <button class="opt-chip" onclick="handleCustomerChoice('all')">استكشاف الكتالوج كاملاً</button>
      </div>
    </section>

    <!-- المرحلة 2: صالة المنتجات والسلة -->
    <section id="stage-showroom" class="view-stage">
      <div class="showroom-header">
        <div>
          <h2 style="font-size: 1.5rem;">صالة عرض المنتجات</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">اختر قطعك لمسح الباركود وإتمام الطلب عبر واتساب</p>
        </div>
        <button class="back-btn" onclick="goToStage('concierge')">الرجوع للاستقبال</button>
      </div>

      <div class="products-grid" id="products-list">
        <!-- تتولد بطاقات المنتجات برمجياً -->
      </div>

      <div class="cart-checkout-section">
        <div class="cart-summary">
          <h3>سلة مشترياتك (<span id="cart-count">0</span> قطع)</h3>
          <ul class="cart-items-list" id="cart-items">
            <li style="color: var(--text-muted);">السلة فارغة حالياً</li>
          </ul>
          <div style="font-size: 1.25rem; font-weight: 700; color: var(--accent-gold); margin-top: 0.8rem;">
            المجموع: <span id="cart-total">0</span> ر.س
          </div>
        </div>

        <div class="qr-container">
          <canvas id="qr-canvas"></canvas>
          <span style="font-size: 0.85rem; color: var(--text-muted);">امسح الرمز لتأكيد الطلب بواتساب</span>
        </div>
      </div>
    </section>
  </div>

  <!-- عناصر الكاميرا للرادار الخلفي -->
  <video id="radar-video" playsinline muted autoplay></video>
  <canvas id="radar-canvas" width="64" height="48"></canvas>

  <!-- مولد QR كود داخلي مستقر -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <script>
    // رقم الواتساب الخاص بالمتجر (استبدله برقمك الدولي دون + أو أصفار)
    const STORE_WHATSAPP_NUMBER = "966500000000";

    // قائمة المنتجات
    const catalog = [
      {
        id: 1,
        title: "تيشيرت Discover Riyadh",
        category: "new_collection",
        price: 199,
        image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80",
        desc: "قصة بوكس فيت ثقيلة، طبعة قصر المصمك، شريحة NFC مدمجة بالسدو."
      },
      {
        id: 2,
        title: "هودي عِزوة الفاخر",
        category: "new_collection",
        price: 289,
        image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80",
        desc: "خامة قطن ثقيل، قصة مريحة وأكمام متناسقة للأجواء الباردة."
      },
      {
        id: 3,
        title: "تيشيرت الستريت وير الكلاسيكي",
        category: "sizes",
        price: 169,
        image: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=600&q=80",
        desc: "قصة أوفر سايز راقية، ألوان حبر معتقة وتطريز جانبي دقيق."
      }
    ];

    let cart = [];
    let audioUnlocked = false;
    let qrGenerator = null;
    let isSpeaking = false;

    // عناصر الصفحة
    const orb = document.getElementById('voice-orb');
    const welcomeMsg = document.getElementById('welcome-message');
    const actionWrapper = document.getElementById('action-wrapper');
    const quickOpts = document.getElementById('quick-options');
    const dot = document.getElementById('radar-status-dot');
    const statusText = document.getElementById('radar-status-text');

    // تفعيل الصوت المباشر بنقرة أولى
    function unlockAudioAndTrigger() {
      if (!audioUnlocked) {
        audioUnlocked = true;
        playChime();
      }
      triggerAwakening();
    }

    // رنين تنبيه تفاعلي
    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {
        console.warn(e);
      }
    }

    // نطق الرسالة
    function speakText(text, callback) {
      if (!('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ar-SA';
      utterance.rate = 0.95;

      utterance.onstart = () => {
        isSpeaking = true;
        orb.classList.add('speaking');
      };
      utterance.onend = () => {
        isSpeaking = false;
        orb.classList.remove('speaking');
        if (callback) callback();
      };
      utterance.onerror = () => {
        isSpeaking = false;
        orb.classList.remove('speaking');
        if (callback) callback();
      };

      window.speechSynthesis.speak(utterance);
    }

    // لحظة الاستيقاظ والترحيب
    let awakened = false;
    function triggerAwakening() {
      if (awakened) return;
      awakened = true;
      playChime();

      const greeting = "حيّاك الله ونوّرت المكان.. ودك تستكشف التشكيلة الجديدة، ولا نساعدك بطلب معين؟";
      welcomeMsg.innerText = greeting;
      speakText(greeting);
    }

    // التعامل مع خيار العميل وتوليد الزر المخصص
    function handleCustomerChoice(choice) {
      quickOpts.style.display = 'none';
      let confirmMsg = "";
      let btnLabel = "";

      if (choice === 'new_collection') {
        confirmMsg = "أبشر، جهزت لك أحدث تشكيلاتنا بقصات البوكس فيت والستريت وير.. تفضل";
        btnLabel = "👉 الدخول لاستعراض التشكيلة الجديدة";
      } else if (choice === 'sizes') {
        confirmMsg = "سم وأبشر، هذي خياراتنا والقصات المتوفرة.. تفضل معي";
        btnLabel = "👉 الدخول واستكشاف القصات والمقاسات";
      } else {
        confirmMsg = "على الرحب والسعة، تفضل لاستعراض كافة القطع";
        btnLabel = "👉 الدخول إلى المعرض بالكامل";
      }

      welcomeMsg.innerText = confirmMsg;
      speakText(confirmMsg);

      // توليد الزر الفردي المخصص
      actionWrapper.innerHTML = `
        <button class="custom-action-btn" onclick="openShowroom('${choice}')">${btnLabel}</button>
      `;
      actionWrapper.style.display = 'flex';
    }

    // فتح صالة المنتجات
    function openShowroom(filterCategory) {
      goToStage('showroom');
      renderProducts(filterCategory);
    }

    // التنقل بين الشاشات
    function goToStage(stageName) {
      document.querySelectorAll('.view-stage').forEach(el => el.classList.remove('active'));
      if (stageName === 'concierge') {
        document.getElementById('stage-concierge').classList.add('active');
        awakened = false;
        quickOpts.style.display = 'flex';
        actionWrapper.style.display = 'none';
        welcomeMsg.innerText = "اقترب من الشاشة أو انقر على الكرة للبدء";
      } else {
        document.getElementById('stage-showroom').classList.add('active');
      }
    }

    // عرض المنتجات في الصالة
    function renderProducts(filter) {
      const container = document.getElementById('products-list');
      container.innerHTML = '';
      
      catalog.forEach(item => {
        const isMatched = (filter === 'all' || item.category === filter);
        const card = document.createElement('div');
        card.className = `product-card ${isMatched ? 'highlight' : ''}`;
        card.innerHTML = `
          <img src="${item.image}" alt="${item.title}" class="product-img">
          <div class="product-info">
            <h4 class="product-title">${item.title}</h4>
            <p class="product-desc">${item.desc}</p>
            <div class="product-bottom">
              <span class="product-price">${item.price} ر.س</span>
              <button class="add-btn" onclick="addToCart(${item.id})">+ إضافة للسلة</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // إضافة إلى السلة
    function addToCart(id) {
      const product = catalog.find(p => p.id === id);
      if (product) {
        cart.push(product);
        playChime();
        updateCartUI();
      }
    }

    // تحديث السلة والـ QR Code
    function updateCartUI() {
      const countEl = document.getElementById('cart-count');
      const totalEl = document.getElementById('cart-total');
      const listEl = document.getElementById('cart-items');

      countEl.innerText = cart.length;
      const total = cart.reduce((acc, curr) => acc + curr.price, 0);
      totalEl.innerText = total;

      if (cart.length === 0) {
        listEl.innerHTML = '<li style="color: var(--text-muted);">السلة فارغة حالياً</li>';
      } else {
        listEl.innerHTML = cart.map((item, index) => `
          <li>
            <span>${item.title}</span>
            <span>${item.price} ر.س</span>
          </li>
        `).join('');
      }

      // بناء رابط ورسالة الواتساب
      let orderText = `مرحباً عِزوة، أود تأكيد طلبي عبر البائع الذكي:%0A`;
      cart.forEach((p, i) => {
        orderText += `- ${p.title} (${p.price} ر.س)%0A`;
      });
      orderText += `الإجمالي: ${total} ر.س`;

      const whatsappURL = `https://wa.me/${STORE_WHATSAPP_NUMBER}?text=${orderText}`;

      // رسم كود الاستجابة السريعة
      if (!qrGenerator) {
        qrGenerator = new QRious({
          element: document.getElementById('qr-canvas'),
          size: 150,
          value: whatsappURL
        });
      } else {
        qrGenerator.value = whatsappURL;
      }
    }

    // محرك الرادار وحساس الكاميرا
    function initCameraRadar() {
      const video = document.getElementById('radar-video');
      const canvas = document.getElementById('radar-canvas');
      const ctx = canvas.getContext('2d');
      let prevFrame = null;

      navigator.mediaDevices.getUserMedia({ video: { width: 128, height: 96 } })
        .then(stream => {
          video.srcObject = stream;
          dot.classList.add('active');
          statusText.innerText = "الرادار البصري نشط";

          setInterval(() => {
            if (awakened || video.readyState < 2) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);

            if (prevFrame) {
              let diff = 0;
              for (let i = 0; i < currentFrame.data.length; i += 4) {
                diff += Math.abs(currentFrame.data[i] - prevFrame.data[i]);
              }
              const score = diff / (canvas.width * canvas.height);
              // إذا اقترب العميل وتغيرت الحركة بنسبة ملحوظة
              if (score > 18) {
                unlockAudioAndTrigger();
              }
            }
            prevFrame = currentFrame;
          }, 300);
        })
        .catch(err => {
          dot.style.background = '#eab308';
          statusText.innerText = "بانتظار إذن الكاميرا (انقر للبدء)";
        });
    }

    window.addEventListener('load', () => {
      initCameraRadar();
      updateCartUI();
    });
  </script>
</body>
</html>
